[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rheorl"
version = "0.0.1"
description = "Rheo — a rollout engine native to RL post-training. Weights flow. Trajectories follow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# bench/analysis：numpy（统计）+ matplotlib（报告插图）
analysis = ["numpy>=1.26", "matplotlib>=3.8"]

# 平面布局，与 PLAN.md §3 的目录结构一一对应
[tool.setuptools.packages.find]
include = [
  "kernels*",
  "runtime*",
  "orchestration*",
  "adapters*",
  "sim*",
  "protocol*",
  "bench*",
  "rheotrace*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
